name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle is missing from the repo - please upload it"
            echo "Files found in repo:"; find . -not -path './.git*' | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project found in: $(dirname "$f")"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report build errors
        if: failure()
        run: |
          # Surface the real error as annotations so it can be read without opening the log.
          grep -nE "What went wrong|error:|ERROR|Could not|Failed|Manifest merger|> " build.log | grep -v "^.*at org.gradle" | head -40 > errs.txt || true
          sed -n '/What went wrong/,/Try:/p' build.log | head -40 >> errs.txt || true
          while IFS= read -r line; do echo "::error::${line//%/%25}"; done < errs.txt

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" XtreamPlayer.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Xtream Player 1.0.${{ github.run_number }}
          files: XtreamPlayer.apk
          make_latest: true
