plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.xtreamplayer.tv'
    compileSdk 36

    defaultConfig {
        applicationId "com.xtreamplayer.tv"
        minSdk 22          // Fire OS 5 and newer (every Fire TV Stick / Cube)
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        ndk {
            // Fire TV devices: 32-bit and 64-bit ARM only (keeps VLC's size down)
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        release {
            // Fixed key so every new build installs over the previous one as an update.
            storeFile file("release.keystore")
            // Key and password come from the repo's secrets (see the workflow's "Signing key" step)
            def pw = System.getenv("KEYSTORE_PASSWORD") ?: ""
            storePassword pw
            keyAlias "xtream"
            keyPassword pw
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        // The build checks only one thing: code that needs a newer Android than the oldest
        // supported device (that crashes there, e.g. the TV guide on Fire OS 6).
        checkOnly 'NewApi'
        abortOnError true
        textReport true
        textOutput file('stdout')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // VLC engine for streams ExoPlayer struggles with (timestamp jumps, odd encodings)
    implementation "org.videolan.android:libvlc-all:3.7.6"
    // QR code for "Add from your phone"
    implementation "com.google.zxing:core:3.5.3"
}
